<!doctype html>
<!--
  A made-up short-video feed (no real site's branding) with the real Focus Guard overlay on top.
  Loads the actual guard scripts with a stand-in extension API; used only for the store screenshot.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: grid; place-items: center; background: #0d0e0e; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
      .video {
        position: relative; width: 340px; height: 600px; border-radius: 14px; overflow: hidden;
        background: radial-gradient(circle at 30% 25%, #ffb36b 0, transparent 40%), radial-gradient(circle at 70% 70%, #6a5cff 0, transparent 45%),
          linear-gradient(160deg, #f45b69, #2b2d42);
      }
      .caption { position: absolute; left: 14px; right: 60px; bottom: 18px; color: #fff; font-size: 14px; text-shadow: 0 1px 2px #0008; }
      .caption b { display: block; margin-bottom: 4px; }
      .side { position: absolute; right: 12px; bottom: 80px; display: grid; gap: 18px; }
      .side span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #ffffff2a; color: #fff; font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="video">
      <div class="side"><span>♥</span><span>💬</span><span>↗</span></div>
      <div class="caption"><b>@someone</b>wait for the ending 😂 #fyp #viral</div>
    </div>
    <script>
      const store = {
        settings: { guardEnabled: true, puzzleEvery: 3, strictDuringFocus: false, platforms: ["youtube"], puzzleKinds: ["odd"] },
        tasks: [{ id: "a", title: "Finish history essay", priority: "high", tag: "study", deadline: "", done: false, createdAt: 1 }],
        focusTaskId: "a",
      };
      window.chrome = {
        storage: { local: {
          get: async (keys) => Object.fromEntries([].concat(keys).filter((k) => k in store).map((k) => [k, structuredClone(store[k])])),
          set: async (obj) => Object.assign(store, obj),
        }, onChanged: { addListener: () => {} } },
        runtime: { id: "preview", getURL: (p) => "/src/" + p, sendMessage: async () => ({ ok: true }) },
      };
      const scripts = ["lib/platforms.js", "lib/settings.js", "lib/captcha.js", "lib/puzzles.js", "lib/pomodoro.js", "lib/tasks.js",
        "content/overlay-style.js", "content/puzzle-view.js"];
      const load = (src) => new Promise((resolve, reject) => {
        const s = document.createElement("script"); s.src = "/src/" + src; s.onload = resolve; s.onerror = reject; document.head.append(s);
      });
      (async () => {
        for (const src of scripts) await load(src);
        FocusPlatforms.platformForHost = () => FocusPlatforms.PLATFORMS.youtube; // treat this page as a Shorts feed
        await load("content/shorts-guard.js");
        for (const id of ["a1", "a2", "a3"]) {
          history.replaceState({}, "", "/shorts/" + id);
          await new Promise((r) => setTimeout(r, 650));
        }
      })();
    </script>
  </body>
</html>
