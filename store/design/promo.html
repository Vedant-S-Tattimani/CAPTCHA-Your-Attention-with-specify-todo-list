<!doctype html>
<!-- Small promotional tile, drawn at 2x (880x560) and scaled to 440x280 by tools/store-images.ps1. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../src/fonts/fonts.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      .tile {
        position: absolute; left: 0; top: 0; width: 880px; height: 560px; overflow: hidden; box-sizing: border-box;
        padding: 64px 56px; font-family: "Segoe UI", system-ui, sans-serif; color: #111212;
        background-color: #ffffff;
        background-image: linear-gradient(#efefef 2px, transparent 2px), linear-gradient(90deg, #efefef 2px, transparent 2px);
        background-size: 56px 56px;
      }
      .hand { display: inline-block; margin: 0 0 18px 6px; font: 52px/1 "Shadows Into Light", cursive; transform: rotate(-4deg); position: relative; }
      .hand::after { content: ""; position: absolute; left: -6px; right: -10px; bottom: -12px; height: 10px; border-bottom: 5px solid #36c5f0; border-radius: 0 0 50% 50%; }
      .sel { position: relative; display: inline-block; padding: 16px 22px 10px; border: 2px solid #36c5f0; font: 800 92px/1 "Bitcount Prop Single", sans-serif; letter-spacing: 2px; }
      .h { position: absolute; width: 14px; height: 14px; background: #36c5f0; }
      .tl { top: -8px; left: -8px; } .tr { top: -8px; right: -8px; } .bl { bottom: -8px; left: -8px; } .br { bottom: -8px; right: -8px; }
      .line { margin-top: 34px; font: 600 34px/1.3 "Segoe UI", sans-serif; color: #2c2e2e; max-width: 560px; }
      .icon { position: absolute; right: 56px; bottom: 56px; width: 168px; height: 168px; filter: drop-shadow(8px 8px 0 #36c5f0); }
      .pill { position: absolute; padding: 8px 20px 6px; border-radius: 99px; font: 700 26px "Bitcount Prop Single", sans-serif; }
      .pill::before { content: ""; position: absolute; top: -22px; left: -18px; width: 26px; height: 26px; background: var(--c); clip-path: polygon(0 0, 100% 45%, 50% 55%, 40% 100%); }
      .p1 { --c: #e01e5a; background: #e01e5a; color: #fff; right: 70px; top: 66px; }
      .p2 { --c: #ecb22e; background: #ecb22e; color: #111212; left: 470px; top: 430px; }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="hand">let's focus!</div><br />
      <div class="sel">FOCUS GUARD<i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i></div>
      <p class="line">Puzzles that stop the endless scroll.</p>
      <span class="pill p1">NO SHORTS</span>
      <span class="pill p2">FOCUS</span>
      <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="96" height="96" rx="22" fill="#111212" />
        <path d="M22 32 h16 a10 10 0 1 1 20 0 h16 v16 a10 10 0 1 1 0 20 v16 h-52 z" fill="#ecb22e" />
        <circle cx="48" cy="58" r="7" fill="#111212" />
        <rect x="80" y="80" width="11" height="11" rx="2" fill="#36c5f0" />
      </svg>
    </div>
  </body>
</html>
